services:
  # MySQL 8 Production Database
  mysql:
    image: mysql:8.0
    container_name: teleflow_mysql
    restart: always
    environment:
      MYSQL_DATABASE: teleflow_db
      MYSQL_USER: teleflow_user
      MYSQL_PASSWORD: teleflow_password
      MYSQL_ROOT_PASSWORD: root_secure_password_2026
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Queue & Caching Engine
  redis:
    image: redis:7-alpine
    container_name: teleflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Python Telethon MTProto Bridge Microservice
  telegram-bridge:
    build:
      context: ./telegram-bridge
      dockerfile: Dockerfile
    container_name: teleflow_bridge
    restart: always
    environment:
      BRIDGE_PORT: 8001
      BRIDGE_SECRET_KEY: "telegram-responder-secret-key-32b"
      BRIDGE_WEBHOOK_SECRET: "bridge-internal-secret-key-2026"
      LARAVEL_WEBHOOK_URL: "http://backend:8000/api/internal/telegram/webhook"
    ports:
      - "8001:8001"
    volumes:
      - ./storage/media:/app/media
    depends_on:
      - redis

  # Laravel 12 API Backend & Queue Worker
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teleflow_backend
    restart: always
    environment:
      APP_NAME: "TeleFlow"
      APP_ENV: production
      APP_KEY: "base64:6kL19vS+3aW4o5Y6Z8Q2e1x0pA7uM4r9sV+zW2eF8gE="
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: teleflow_db
      DB_USERNAME: teleflow_user
      DB_PASSWORD: teleflow_password
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEGRAM_BRIDGE_URL: "http://telegram-bridge:8001"
      BRIDGE_WEBHOOK_SECRET: "bridge-internal-secret-key-2026"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - ./storage/media:/var/www/html/storage/app/public/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      telegram-bridge:
        condition: service_started

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
